name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # tag push + gh release create with GITHUB_TOKEN
    outputs:
      deployed: ${{ steps.check.outputs.deployed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A release is a git tag: Swift Package Manager resolves versions from tags. CocoaPods
      # trunk goes read-only on Dec 2, 2026, and 6.0.7 is the last version published there.
      # CocoaPods users on later versions point the pod at a tag instead.
      - name: Check version
        id: check
        run: |
          SWIFT_VERSION=$(grep 'internal static let version =' Sources/Courier_iOS/Courier_iOS.swift | awk -F '"' '{print $2}')
          PODSPEC_VERSION=$(grep "s\.version\s*=" Courier_iOS.podspec | head -1 | awk -F "'" '{print $2}')

          if [ "$SWIFT_VERSION" != "$PODSPEC_VERSION" ]; then
            echo "::error::Version mismatch! Courier_iOS.swift ($SWIFT_VERSION) != Courier_iOS.podspec ($PODSPEC_VERSION)"
            exit 1
          fi

          VERSION="$SWIFT_VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            # Expected for pushes that ship no source changes (docs, workflows). If this fires after
            # a change under Sources/, the version was not bumped and this release ships nothing
            # -- the CI "Version guard" job is meant to block that before merge.
            echo "::warning::Version $VERSION is already released; nothing to deploy. If this push changed Sources/, the version needed a bump and those changes are NOT released."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version $VERSION not yet released. Deploying."
            echo "deployed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create git tag
        if: steps.check.outputs.deployed == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Generate release notes
        if: steps.check.outputs.deployed == 'true'
        id: notes
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || git rev-list --max-parents=0 HEAD)
          NOTES=$(git log "$PREVIOUS_TAG"..HEAD --pretty=format:"- %s" --no-merges)
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.check.outputs.deployed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
          # Commit subjects are untrusted; as env they stay data instead of becoming shell source.
          RELEASE_NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          gh release create "$VERSION" --notes "$RELEASE_NOTES"

  # Runs whenever deploy succeeds, even if the version was already released (deployed=false).
  # Downstream repos may still pin an older Courier_iOS; each step compares podspec to VERSION.
  bump-downstream:
    name: Bump Downstream Dependencies
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: trycourier
          repositories: courier-flutter,courier-react-native

      # gh repo clone uses GH_TOKEN; git push does not unless git is configured.
      - name: Configure git for HTTPS with app token
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh auth setup-git

      - name: Bump courier-flutter
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.deploy.outputs.version }}
        run: |
          set -euo pipefail
          git config --global user.name "courier-ios-automation[bot]"
          git config --global user.email "courier-ios-automation[bot]@users.noreply.github.com"

          # Full clone avoids shallow-merge quirks; branch bumps from `main` and PRs target `main`.
          gh repo clone trycourier/courier-flutter
          cd courier-flutter
          git fetch origin main
          git checkout main

          # Swift Package Manager gets every release: .package(url: ".../courier-ios", exact: "x.y.z").
          # The podspec stays on 6.0.7, the last Courier_iOS on CocoaPods trunk, so it isn't bumped.
          CURRENT=$(grep -oP 'courier-ios", exact: "\K[^"]+' ios/courier_flutter/Package.swift | head -1 || true)
          if [ -z "$CURRENT" ]; then
            echo "::error::Could not read the Courier_iOS version from ios/courier_flutter/Package.swift"
            exit 1
          fi
          if [ "$CURRENT" = "$VERSION" ]; then
            echo "courier-flutter already pins Courier_iOS $VERSION; skipping."
            exit 0
          fi
          echo "courier-flutter: bumping Courier_iOS $CURRENT -> $VERSION"

          git checkout -b "bump-courier-ios-$VERSION"
          sed -i 's/\(courier-ios", exact: "\)[^"]*"/\1'"$VERSION"'"/' ios/courier_flutter/Package.swift
          # The example's notification service extension links Courier_iOS through SPM too.
          perl -0pi -e 's/(repositoryURL = "https:\/\/github\.com\/trycourier\/courier-ios";\s*requirement = \{[^}]*minimumVersion = )[0-9.]+;/${1}'"$VERSION"';/' example/ios/Runner.xcodeproj/project.pbxproj

          git add -A
          git commit -m "Bump Courier_iOS to $VERSION"
          # Retry runs reuse the same branch name; overwrite prior bot pushes on remote.
          git push -u origin "bump-courier-ios-$VERSION" --force
          # gh defaults to GITHUB_REPOSITORY (courier-ios) in Actions unless --repo is set.
          BUMP_BRANCH="bump-courier-ios-$VERSION"
          if [ "$(gh pr list --repo trycourier/courier-flutter --state open --head "$BUMP_BRANCH" --json number --jq 'length')" -eq 0 ]; then
            echo "Creating PR: base=main head=$BUMP_BRANCH"
            gh pr create \
              --repo trycourier/courier-flutter \
              --base main \
              --head "$BUMP_BRANCH" \
              --title "Bump Courier_iOS to $VERSION" \
              --body "Auto-generated PR to update Courier_iOS dependency to $VERSION (released on GitHub)."
          else
            echo "PR already open for bump-courier-ios-$VERSION; branch updated."
          fi

      - name: Bump courier-react-native
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.deploy.outputs.version }}
        run: |
          set -euo pipefail
          cd "${{ runner.temp }}"

          gh repo clone trycourier/courier-react-native
          cd courier-react-native
          git fetch origin main
          git checkout main

          # The podspec pins `courier_ios_version = "x.y.z"` for spm_dependency, which gets every
          # release. The CocoaPods fallback (`courier_ios_trunk_version`) stays on 6.0.7, the last
          # Courier_iOS on trunk, so it isn't bumped.
          # `|| true`: under pipefail a grep that matches nothing would end the step.
          CURRENT=$(grep -oP 'courier_ios_version = "\K[^"]+' courier-react-native.podspec | head -1 || true)
          if [ -z "$CURRENT" ]; then
            echo "::error::Could not read Courier_iOS version from courier-react-native.podspec"
            exit 1
          fi
          if [ "$CURRENT" = "$VERSION" ]; then
            echo "courier-react-native already pins Courier_iOS $VERSION; skipping."
            exit 0
          fi
          echo "courier-react-native: bumping Courier_iOS $CURRENT -> $VERSION"

          git config --global user.name "courier-ios-automation[bot]"
          git config --global user.email "courier-ios-automation[bot]@users.noreply.github.com"

          git checkout -b "bump-courier-ios-$VERSION"
          sed -i 's/courier_ios_version = "[^"]*"/courier_ios_version = "'"$VERSION"'"/' courier-react-native.podspec

          git add -A
          git commit -m "Bump Courier_iOS to $VERSION"
          git push -u origin "bump-courier-ios-$VERSION" --force
          BUMP_BRANCH="bump-courier-ios-$VERSION"
          if [ "$(gh pr list --repo trycourier/courier-react-native --state open --head "$BUMP_BRANCH" --json number --jq 'length')" -eq 0 ]; then
            echo "Creating PR: base=main head=$BUMP_BRANCH"
            gh pr create \
              --repo trycourier/courier-react-native \
              --base main \
              --head "$BUMP_BRANCH" \
              --title "Bump Courier_iOS to $VERSION" \
              --body "Auto-generated PR to update Courier_iOS dependency to $VERSION (released on GitHub)."
          else
            echo "PR already open for bump-courier-ios-$VERSION; branch updated."
          fi
