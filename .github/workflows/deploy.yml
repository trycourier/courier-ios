name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to CocoaPods
    runs-on: macos-latest
    permissions:
      contents: write   # tag push + gh release create with GITHUB_TOKEN
    outputs:
      deployed: ${{ steps.check.outputs.deployed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version
        id: check
        run: |
          SWIFT_VERSION=$(grep 'internal static let version =' Sources/Courier_iOS/Courier_iOS.swift | awk -F '"' '{print $2}')
          PODSPEC_VERSION=$(grep "s\.version\s*=" Courier_iOS.podspec | head -1 | awk -F "'" '{print $2}')

          if [ "$SWIFT_VERSION" != "$PODSPEC_VERSION" ]; then
            echo "::error::Version mismatch! Courier_iOS.swift ($SWIFT_VERSION) != Courier_iOS.podspec ($PODSPEC_VERSION)"
            exit 1
          fi

          VERSION="$SWIFT_VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

          PUBLISHED=$(curl -sf "https://trunk.cocoapods.org/api/v1/pods/Courier_iOS" \
            | python3 -c "import sys,json; vs=[v['name'] for v in json.load(sys.stdin)['versions']]; print('\n'.join(vs))" 2>/dev/null || echo "")

          if echo "$PUBLISHED" | grep -qx "$VERSION"; then
            # Expected for pushes that ship no source changes (docs, workflows). If this fires after
            # a change under Sources/, the version was not bumped and this release publishes nothing
            # -- the CI "Version guard" job is meant to block that before merge.
            echo "::warning::Version $VERSION is already published on CocoaPods; nothing to deploy. If this push changed Sources/, the version needed a bump and those changes are NOT released."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version $VERSION not yet published. Deploying."
            echo "deployed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create git tag
        if: steps.check.outputs.deployed == 'true'
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Generate release notes
        if: steps.check.outputs.deployed == 'true'
        id: notes
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || git rev-list --max-parents=0 HEAD)
          NOTES=$(git log "$PREVIOUS_TAG"..HEAD --pretty=format:"- %s" --no-merges)
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.check.outputs.deployed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          gh release create "$VERSION" --notes "${{ steps.notes.outputs.notes }}"

      - name: Setup CocoaPods auth
        if: steps.check.outputs.deployed == 'true'
        run: |
          echo "machine trunk.cocoapods.org
            login ${{ secrets.COCOAPODS_TRUNK_EMAIL }}
            password ${{ secrets.COCOAPODS_TRUNK_TOKEN }}" > ~/.netrc
          chmod 0600 ~/.netrc

      - name: Install CocoaPods
        if: steps.check.outputs.deployed == 'true'
        run: gem install cocoapods

      - name: Publish to CocoaPods
        if: steps.check.outputs.deployed == 'true'
        run: pod trunk push Courier_iOS.podspec --allow-warnings

  # Runs whenever deploy succeeds, even if Trunk already had this version (deployed=false).
  # Downstream repos may still pin an older Courier_iOS; each step compares podspec to VERSION.
  bump-downstream:
    name: Bump Downstream Dependencies
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: trycourier
          repositories: courier-flutter,courier-react-native

      # gh repo clone uses GH_TOKEN; git push does not unless git is configured.
      - name: Configure git for HTTPS with app token
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh auth setup-git

      - name: Bump courier-flutter
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.deploy.outputs.version }}
        run: |
          set -euo pipefail
          git config --global user.name "courier-ios-automation[bot]"
          git config --global user.email "courier-ios-automation[bot]@users.noreply.github.com"

          # Full clone avoids shallow-merge quirks; branch bumps from `main` and PRs target `main`.
          gh repo clone trycourier/courier-flutter
          cd courier-flutter
          git fetch origin main
          git checkout main

          # Single-quoted podspec: s.dependency 'Courier_iOS', 'x.y.z'
          CURRENT=$(grep -oP "Courier_iOS',\\s*'\\K[^']+" ios/courier_flutter.podspec | head -1)
          if [ -z "$CURRENT" ]; then
            echo "::error::Could not read Courier_iOS version from ios/courier_flutter.podspec"
            exit 1
          fi
          if [ "$CURRENT" = "$VERSION" ]; then
            echo "courier-flutter already pins Courier_iOS $VERSION; skipping."
            exit 0
          fi
          echo "courier-flutter: bumping Courier_iOS $CURRENT -> $VERSION"

          git checkout -b "bump-courier-ios-$VERSION"
          # Flutter podspec uses single quotes: s.dependency 'Courier_iOS', '5.7.14'
          sed -i "s/s.dependency 'Courier_iOS', '[^']*'/s.dependency 'Courier_iOS', '$VERSION'/" ios/courier_flutter.podspec
          # Swift Package Manager pins the same version: .package(url: ".../courier-ios", exact: "5.9.0")
          if [ -f ios/courier_flutter/Package.swift ]; then
            sed -i 's/\(courier-ios", exact: "\)[^"]*"/\1'"$VERSION"'"/' ios/courier_flutter/Package.swift
          fi
          # The example's notification service extension links Courier_iOS through SPM too.
          perl -0pi -e 's/(repositoryURL = "https:\/\/github\.com\/trycourier\/courier-ios";\s*requirement = \{[^}]*minimumVersion = )[0-9.]+;/${1}'"$VERSION"';/' example/ios/Runner.xcodeproj/project.pbxproj

          git add -A
          git commit -m "Bump Courier_iOS to $VERSION"
          # Retry runs reuse the same branch name; overwrite prior bot pushes on remote.
          git push -u origin "bump-courier-ios-$VERSION" --force
          # gh defaults to GITHUB_REPOSITORY (courier-ios) in Actions unless --repo is set.
          BUMP_BRANCH="bump-courier-ios-$VERSION"
          if [ "$(gh pr list --repo trycourier/courier-flutter --state open --head "$BUMP_BRANCH" --json number --jq 'length')" -eq 0 ]; then
            echo "Creating PR: base=main head=$BUMP_BRANCH"
            gh pr create \
              --repo trycourier/courier-flutter \
              --base main \
              --head "$BUMP_BRANCH" \
              --title "Bump Courier_iOS to $VERSION" \
              --body "Auto-generated PR to update Courier_iOS dependency to $VERSION (published to CocoaPods)."
          else
            echo "PR already open for bump-courier-ios-$VERSION; branch updated."
          fi

      - name: Bump courier-react-native
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.deploy.outputs.version }}
        run: |
          set -euo pipefail
          cd "${{ runner.temp }}"

          gh repo clone trycourier/courier-react-native
          cd courier-react-native
          git fetch origin main
          git checkout main

          # The podspec pins `courier_ios_version = "x.y.z"` (used by spm_dependency and the
          # CocoaPods fallback). Older releases used s.dependency "Courier_iOS", "x.y.z".
          # `|| true`: under pipefail a grep that matches nothing would end the step.
          CURRENT=$(grep -oP 'courier_ios_version = "\K[^"]+' courier-react-native.podspec | head -1 || true)
          if [ -z "$CURRENT" ]; then
            CURRENT=$(grep -oP 'Courier_iOS",\s*"\K[^"]+' courier-react-native.podspec | head -1 || true)
          fi
          if [ -z "$CURRENT" ]; then
            echo "::error::Could not read Courier_iOS version from courier-react-native.podspec"
            exit 1
          fi
          if [ "$CURRENT" = "$VERSION" ]; then
            echo "courier-react-native already pins Courier_iOS $VERSION; skipping."
            exit 0
          fi
          echo "courier-react-native: bumping Courier_iOS $CURRENT -> $VERSION"

          git config --global user.name "courier-ios-automation[bot]"
          git config --global user.email "courier-ios-automation[bot]@users.noreply.github.com"

          git checkout -b "bump-courier-ios-$VERSION"
          sed -i 's/courier_ios_version = "[^"]*"/courier_ios_version = "'"$VERSION"'"/' courier-react-native.podspec
          sed -i 's/s.dependency "Courier_iOS", "[^"]*"/s.dependency "Courier_iOS", "'"$VERSION"'"/' courier-react-native.podspec

          git add -A
          git commit -m "Bump Courier_iOS to $VERSION"
          git push -u origin "bump-courier-ios-$VERSION" --force
          BUMP_BRANCH="bump-courier-ios-$VERSION"
          if [ "$(gh pr list --repo trycourier/courier-react-native --state open --head "$BUMP_BRANCH" --json number --jq 'length')" -eq 0 ]; then
            echo "Creating PR: base=main head=$BUMP_BRANCH"
            gh pr create \
              --repo trycourier/courier-react-native \
              --base main \
              --head "$BUMP_BRANCH" \
              --title "Bump Courier_iOS to $VERSION" \
              --body "Auto-generated PR to update Courier_iOS dependency to $VERSION (published to CocoaPods)."
          else
            echo "PR already open for bump-courier-ios-$VERSION; branch updated."
          fi

  # Runs after every successful deploy, so TestFlight always has the sample app built against
  # what just shipped. The Example builds Courier_iOS from this checkout.
  # Skips with a warning until the App Store Connect API key secrets exist.
  testflight:
    name: Upload sample app to TestFlight
    runs-on: macos-15
    needs: deploy
    env:
      # App Store uploads require the iOS 26 SDK
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - name: Check for App Store Connect key
        id: keys
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ]; then
            echo "::warning::APP_STORE_CONNECT_KEY_ID / APP_STORE_CONNECT_ISSUER_ID / APP_STORE_CONNECT_PRIVATE_KEY are not set; skipping the TestFlight upload."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.keys.outputs.ready == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the build number is the commit count

      - name: Generate Env.swift from secrets
        if: steps.keys.outputs.ready == 'true'
        env:
          COURIER_USER_ID: ${{ secrets.COURIER_USER_ID }}
          COURIER_AUTH_KEY: ${{ secrets.COURIER_AUTH_KEY }}
          COURIER_CLIENT_KEY: ${{ secrets.COURIER_CLIENT_KEY }}
          COURIER_BRAND_ID: ${{ secrets.COURIER_BRAND_ID }}
          COURIER_PREFERENCE_TOPIC_ID: ${{ secrets.COURIER_PREFERENCE_TOPIC_ID }}
          COURIER_MESSAGE_TEMPLATE_ID: ${{ secrets.COURIER_MESSAGE_TEMPLATE_ID }}
        run: |
          python3 << 'PY'
          import os
          def q(k):
              return os.environ.get(k, "").replace("\\", "\\\\").replace('"', '\\"')
          src = f'''import Foundation

          class Env {{

              static let COURIER_USER_ID = "{q('COURIER_USER_ID')}"
              static let COURIER_AUTH_KEY = "{q('COURIER_AUTH_KEY')}"
              static let COURIER_CLIENT_KEY = "{q('COURIER_CLIENT_KEY')}"
              static let COURIER_BRAND_ID = "{q('COURIER_BRAND_ID')}"
              static let COURIER_PREFERENCE_TOPIC_ID = "{q('COURIER_PREFERENCE_TOPIC_ID')}"
              static let COURIER_MESSAGE_TEMPLATE_ID = "{q('COURIER_MESSAGE_TEMPLATE_ID')}"

          }}
          '''
          open("Example/Example/Env.swift", "w").write(src)
          PY

      - name: Write App Store Connect key
        if: steps.keys.outputs.ready == 'true'
        env:
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY_PATH"
          chmod 0600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # TestFlight rejects a build number it has already seen. The commit count on main only grows.
      # The version shown in TestFlight is the Courier_iOS version the build contains.
      - name: Set version and build number
        if: steps.keys.outputs.ready == 'true'
        working-directory: Example
        run: |
          BUILD=$(git rev-list --count HEAD)
          agvtool new-version -all "$BUILD" > /dev/null
          agvtool new-marketing-version "${{ needs.deploy.outputs.version }}" > /dev/null
          echo "Sample app ${{ needs.deploy.outputs.version }} ($BUILD)"

      # Automatic signing with the API key: Xcode creates or reuses the cloud-managed
      # distribution certificate and the profiles for the app and its notification extension.
      - name: Archive
        if: steps.keys.outputs.ready == 'true'
        working-directory: Example
        run: |
          xcodebuild archive \
            -project Example.xcodeproj \
            -scheme Example \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Example.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -quiet

      - name: Upload to TestFlight
        if: steps.keys.outputs.ready == 'true'
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>destination</key>
              <string>upload</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>teamID</key>
              <string>83BJVWGX4Q</string>
              <key>manageAppVersionAndBuildNumber</key>
              <false/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Example.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
